aid: granata-bio
name: Granata Bio
description: 'Granata Bio is a reproductive-health biopharmaceutical company founded
  in 2018 and headquartered in the United States, focused on expanding access to fertility
  and IVF therapeutics across North America. The company identifies, licenses, and
  develops biopharmaceuticals spanning the in-vitro fertilization medication lifecycle
  from ovarian stimulation through luteal phase support, and is advancing a clinical
  pipeline that includes the Phase III GRACE Study. Granata Bio has raised over $30M,
  including a $14M Series A led by GV (Google Ventures) and a subsequent $15M Series
  A+. It operates a corporate and clinical web presence only and does not currently
  publish a public developer platform, API, or machine-readable interface; this profile
  captures its identity and web properties within the API Evangelist network.'
